<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ورود به صندوق</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f4f4; display: flex;
               justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #fff; padding: 40px; border-radius: 12px;
               box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; }
        h1 { text-align: center; font-size: 24px; margin-bottom: 25px; }
        label { display: block; margin-bottom: 6px; font-size: 16px; }
        input { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 18px;
                border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; font-size: 18px; font-weight: bold;
                 background: #007bff; color: #fff; border: none; border-radius: 8px;
                 cursor: pointer; }
        button:hover { background: #0069d9; }
        .error { color: #c00; text-align: center; margin-bottom: 12px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🔐 ورود به صندوق</h1>
        {% if form.errors %}
            <div class="error">نام کاربری یا رمز عبور اشتباه است.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="id_username">نام کاربری</label>
            {{ form.username }}
            <label for="id_password">رمز عبور</label>
            {{ form.password }}
            <button type="submit">ورود</button>
        </form>
    </div>
</body>
</html>
